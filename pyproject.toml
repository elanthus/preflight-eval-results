[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "preflight-eval-reference"
version = "1.0.0"
description = "Reproducible synthetic replay and reusable Agentic Preflight evaluation library"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Michael Swailes" }]
dependencies = ["jsonschema>=4.25,<5", "numpy>=2.3,<3", "PyYAML>=6,<7", "rfc3339-validator>=0.1.4,<1", "rfc3986-validator>=0.1.1,<1", "tiktoken>=0.11,<1"]

[project.scripts]
preflight-eval-reference = "preflight_evals.public_replay:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
    "types-jsonschema>=4.25,<5",
    "types-PyYAML>=6,<7",
    "build>=1.3,<2",
    "hatchling>=1.27,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/preflight_evals"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "preflight_evals/schemas"
"examples/synthetic-v1" = "preflight_evals/example_data"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
