[general]
base_ref = "main"

[commands]
lint = "uv run --locked ruff check . && uv run --locked mypy && uv run --locked python scripts/check_source_manifest.py"
test = "uv run --locked pytest -q && uv run --locked python scripts/verify_distribution.py"

[docs]
enabled = true
paths = ["README.md", "index.md", "methods/**"]

[diff]
max_bytes = 2000000
# Mechanically exported library/schema/fixture bytes are pinned in source-manifest.json.
# Keep unchanged exports in the PR; public repairs are included in the local review.
exclude = [
  "src/preflight_evals/adjudicate.py",
  "src/preflight_evals/artifact_policy.py",
  "src/preflight_evals/attempt_metadata.py",
  "src/preflight_evals/canonical.py",
